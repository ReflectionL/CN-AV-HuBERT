# @package _group_

common:
  fp16: true
  log_format: json
  log_interval: 200
  tensorboard_logdir: tblog
  seed: 42
  user_dir: ???

checkpoint:
  save_interval: 2
  keep_interval_updates: 1
  no_epoch_checkpoints: true
  best_checkpoint_metric: accuracy
  maximize_best_checkpoint_metric: true

distributed_training:
  ddp_backend: c10d
  find_unused_parameters: true
  distributed_world_size: 6
  distributed_port: 29671
  nprocs_per_node: 6

task:
  _name: av_hubert_pretraining
  is_s2s: true
  data: ???
  label_dir: ???
  tokenizer_bpe_model: null  # optional, only required for sentencepiece
  normalize: true  # must be consistent with pre-training
  labels: ["wrd"]
  single_target: true
  fine_tuning: true
  stack_order_audio: 4
  tokenizer_bpe_name: sentencepiece
  max_sample_size: 750  # 增加样本大小，增加数据多样性
  modalities: ["video"]
  image_aug: true
  pad_audio: true
  random_crop: false  # 启用随机裁剪，增加数据增强

dataset:
  num_workers: 6
  max_tokens: 3000
  validate_after_updates: 0
  validate_interval: 2  # 更频繁的验证，及时发现过拟合
  train_subset: train
  valid_subset: valid

criterion:
  _name: label_smoothed_cross_entropy_with_ctc
  ctc_weight: 0.3
  reverse_weight: 0.3
  report_accuracy: true
  label_smoothing: 0.10
  zero_infinity: true

optimization:
  max_update: 60000
  lr: [0.0001]
  clip_norm: 10.0
  sentence_avg: true
  update_freq: [1]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08

lr_scheduler:
  _name: tri_stage
  warmup_steps: 1000  # 1000 = 2 epoch
  hold_steps: 0
  decay_steps: 59000
  final_lr_scale: 0.05

model:
  _name: av_hubert_seq2seq
  w2v_path: ???
  apply_mask: false
  mask_selection: static
  mask_length: 10
  mask_other: 0
  mask_prob: 0.75
  mask_channel_selection: static
  mask_channel_length: 64
  mask_channel_other: 0
  mask_channel_prob: 0.5
  layerdrop: 0.1  # 增加layerdrop
  dropout: 0.1  # 增加dropout
  activation_dropout: 0.1  # 增加activation dropout
  attention_dropout: 0.1  # 增加attention dropout
  feature_grad_mult: 1.0
  decoder_embed_dim: 1024
  decoder_ffn_embed_dim: 4096
  decoder_attention_heads: 16
  decoder_layers: 6
  decoder_dropout: 0.2  # 增加decoder dropout
  decoder_attention_dropout: 0.2  # 增加decoder attention dropout
  decoder_activation_dropout: 0.2  # 增加decoder activation dropout
  freeze_finetune_updates: 15000  # 减少冻结步数，让模型更早开始全参数训练
  share_decoder_input_output_embed: true
  decoder_normalize_before: true
  use_reverse_decoder: true
  reverse_decoder_layers: 3
  use_ctc: true
  ctc_weight: 0.3

hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
          - model.w2v_path
          - dataset.train_subset
          - dataset.valid_subset
          - criterion.wer_kenlm_model
          - criterion.wer_lexicon
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
