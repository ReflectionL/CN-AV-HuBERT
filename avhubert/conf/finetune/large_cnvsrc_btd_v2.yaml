# @package _group_
# v2 改动汇总：
#   1. encoder_lr_scale=0.1  →  encoder 有效 LR = global LR × 0.1
#   2. encoder_unfreeze_warmup=2000  →  解冻后 encoder LR 线性 warmup 2000 steps
#   3. freeze_finetune_updates=15000  →  decoder 先充分收敛再开放 encoder
#   4. dropout 全部从 0.1 → 0.2  →  缓解 train/valid gap
#   5. bf16 替换 fp16  →  消除梯度溢出

common:
  bf16: true
  log_format: json
  log_interval: 200
  tensorboard_logdir: tblog
  seed: 42
  user_dir: ???

checkpoint:
  save_interval: 2
  keep_interval_updates: 1
  no_epoch_checkpoints: true
  best_checkpoint_metric: accuracy
  maximize_best_checkpoint_metric: true

distributed_training:
  ddp_backend: c10d
  find_unused_parameters: true
  distributed_world_size: 6
  distributed_port: 29671
  nprocs_per_node: 6

task:
  _name: av_hubert_pretraining
  is_s2s: true
  data: ???
  label_dir: ???
  tokenizer_bpe_model: null
  normalize: true
  labels: ["wrd"]
  single_target: true
  fine_tuning: true
  stack_order_audio: 4
  tokenizer_bpe_name: sentencepiece
  max_sample_size: 750
  modalities: ["video"]
  image_aug: true
  pad_audio: true
  random_crop: false

dataset:
  num_workers: 6
  max_tokens: 3000
  validate_after_updates: 0
  validate_interval: 2
  train_subset: train
  valid_subset: valid

criterion:
  _name: label_smoothed_cross_entropy_with_ctc
  ctc_weight: 0.3
  reverse_weight: 0.3
  report_accuracy: true
  label_smoothing: 0.10
  zero_infinity: true

optimization:
  max_update: 60000
  lr: [0.0001]
  clip_norm: 10.0
  sentence_avg: true
  update_freq: [1]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08

lr_scheduler:
  _name: tri_stage
  warmup_steps: 1000
  hold_steps: 0
  decay_steps: 59000
  final_lr_scale: 0.05

model:
  _name: av_hubert_seq2seq
  w2v_path: ???
  apply_mask: false
  mask_selection: static
  mask_length: 10
  mask_other: 0
  mask_prob: 0.75
  mask_channel_selection: static
  mask_channel_length: 64
  mask_channel_other: 0
  mask_channel_prob: 0.5
  layerdrop: 0.1
  dropout: 0.2
  activation_dropout: 0.2
  attention_dropout: 0.2
  feature_grad_mult: 1.0
  decoder_embed_dim: 1024
  decoder_ffn_embed_dim: 4096
  decoder_attention_heads: 16
  decoder_layers: 6
  decoder_dropout: 0.2
  decoder_attention_dropout: 0.2
  decoder_activation_dropout: 0.2
  freeze_finetune_updates: 15000
  encoder_lr_scale: 0.1
  encoder_unfreeze_warmup: 2000
  share_decoder_input_output_embed: true
  decoder_normalize_before: true
  use_reverse_decoder: true
  reverse_decoder_layers: 3
  use_ctc: true
  ctc_weight: 0.3

hydra:
  job:
    config:
      override_dirname:
        kv_sep: '-'
        item_sep: '__'
        exclude_keys:
          - run
          - task.data
          - task.label_dir
          - model.w2v_path
          - dataset.train_subset
          - dataset.valid_subset
          - criterion.wer_kenlm_model
          - criterion.wer_lexicon
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
